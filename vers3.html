<script type="module">

import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

// Declare the chart dimensions and margins.
const svgWidth = 1000;
const svgHeight = 1000;

let ELBASZAS_MERO = 0.001;

function elbaszo(x) {
    
    if (Math.random() > 0.5) {  // plus
        return x * (1 + Math.random() * ELBASZAS_MERO)
    } else { // minus
        return x * (1 - Math.random() * ELBASZAS_MERO)
    } 
    
}
// Create the SVG container.
let svg = d3.select("#container")
  .append("svg")
  .attr("viewBox", [0, 0, svgWidth, svgHeight]);
//   .attr("width", svgWidth)
//   .attr("height", svgHeight);


// CORE SHAPE FUNCTIONS

function getRightX(elem) {
    // attach temporarily so the browser computes geometry
    svg.node().appendChild(elem.node());
    const bbox = elem.node().getBBox();
    elem.node().remove();
    let corner = new DOMPoint(bbox.x + bbox.width, bbox.y);
    let rightX = corner.matrixTransform(elem.node().getCTM()).x;
    return rightX
}

function appendLine(elem, x1, y1, x2, y2) {
    elem.append("line")
        .attr("x1", elbaszo(x1))
        .attr("y1", elbaszo(y1))
        .attr("x2", elbaszo(x2))
        .attr("y2", elbaszo(y2))
        .attr("stroke", "black")
}

function appendCurve(elem, p1, p2, c1, c2) {

    elem.append("path")
        .attr("d", `M ${elbaszo(p1.x)} ${elbaszo(p1.y)} C ${elbaszo(c1.x)} ${elbaszo(c1.y)}, ${elbaszo(c2.x)} ${elbaszo(c2.y)}, ${elbaszo(p2.x)} ${elbaszo(p2.y)}`)
        .attr("fill", "none")
        .attr("stroke", "black");
}

function appendArc(elem, x, y, r, start, end) {
    elem.append("path")
        .attr("transform", "translate("+elbaszo(x)+","+elbaszo(y)+")")
        .attr("d", d3.arc()({
            innerRadius: elbaszo(r/2-1),
            outerRadius: elbaszo(r/2),
            startAngle: elbaszo(start),
            endAngle: elbaszo(end)
        }));;
}

function appendCircle(elem, x, y, r) {
    elem.append('circle')
    .attr('cx', elbaszo(x))
    .attr('cy', elbaszo(y))
    .attr('r', elbaszo(r))
    .attr('stroke', 'black')
    .attr('fill', '#black');
  
}

function a(x, y, size) {

    const letterA = d3.create("svg:g")
        .attr("class", "letter-a");

    appendLine(letterA, x, y, x+size/2, y-size)
    appendLine(letterA, x+size/2, y-size, x+size, y)
    appendLine(letterA, x+size/4, y-size/2, x+size/4*3, y-size/2)

    return letterA
}

function aa(x, y, size) {

    const width = size
    const height = size

    const letterAA = d3.create("svg:g")
        .attr("class", "letter-a");

    appendLine(letterAA, x, y, x+width/2, y-height)
    appendLine(letterAA, x+width/2, y-height, x+width, y)
    appendLine(letterAA, x+width/4, y-height/2, x+width/4*3, y-height/2)

    appendLine(letterAA, x+width*0.75, y-height*0.8, x+width*0.75, y-height*1.1)
    
    return letterAA
}

function b(x, y, size) {

    const width = size
    const height = size

    const letterB = d3.create("svg:g")
        .attr("class", "letter-b")

    appendLine(letterB, x, y, x, y-height)

    appendCurve(
        letterB,
        {x: x, y: y-height},
        {x: x, y: y-height/2},
        {x: x+width/2, y: y-height},
        {x: x+width/2, y: y-height/2}
    )

    appendCurve(
        letterB,
        {x: x, y: y-height/2},
        {x: x, y: y},
        {x: x+width/1.5, y: y-height/2},
        {x: x+width/1.5, y: y}
    )
    
    return letterB
}


function c(x, y, size) {

    const width = size
    const height = size

    const letterC = d3.create("svg:g")
        .attr("class", "letter-c")

    appendArc(letterC, x+width/2, y-height/2, height, -4, 0.8)

    // attach temporarily so the browser computes geometry
    // svg.node().appendChild(letterC.node());
    // const bbox = letterC.node().getBBox();
    // letterC.node().remove();
    // let corner = new DOMPoint(bbox.x + bbox.width, bbox.y);
    // let rightX = corner.matrixTransform(letterC.node().getCTM()).x;
    // const rightX = getRightX(letterC)

    return letterC

}

function cs(x, y, size) {

    const width = size
    const height = size

    const letterCs = d3.create("svg:g")
        .attr("class", "letter-c")

    letterCs.append("path")
    .attr("transform", "translate("+(x+width/2)+","+(y-height/2)+")")
    .attr("d", d3.arc()({
      innerRadius: height/2-1,
      outerRadius: height/2,
      startAngle: -4,
      endAngle: 0.8
    }));;

    // letterCs.append("path")
    //     .attr("transform", "translate("+(x+width*1.25)+","+(y-height/2)+")")
    //     .attr("d", d3.arc()({
    //         innerRadius: height/6-1,
    //         outerRadius: height/6,
    //         startAngle: Math.PI/4,
    //         endAngle: -Math.PI
    //     }))

    // letterCs.append("path")
    //     .attr("transform", "translate("+(x+width*1.25)+","+(y-height/6)+")")
    //     .attr("d", d3.arc()({
    //         innerRadius: height/6,
    //         outerRadius: height/6+1,
    //         startAngle: Math.PI*1.5,
    //         endAngle: -Math.PI*0.025
    //     }))


    const r = height / 6;
    const cx = x + width * 1.15;
    const topY = y - height / 2;   // top circle center
    const botY = y - height / 6;   // bottom circle center

    letterCs.append("path")
        .attr("d", `M ${cx + r * Math.SQRT1_2} ${topY - r * Math.SQRT1_2}
                    A ${r} ${r} 0 1 0 ${cx} ${topY + r}
                    A ${r} ${r} 0 1 1 ${cx - r} ${botY}`)
        .attr("fill", "none")
        .attr("stroke", "black")
        .attr("stroke-width", 1)
        .attr("stroke-linecap", "round");
        
    return letterCs

}

function d(x, y, size) {

    const width = size
    const height = size

    const letterD = d3.create("svg:g")
        .attr("class", "letter-d")

    appendLine(letterD, x, y, x, y-height)
    appendCurve(letterD,
        {x: x, y: y-height},
        {x: x, y: y},
        {x: x+width, y: y-height},
        {x: x+width, y: y}
    )

    return letterD
}

function dz(x, y, size) {

    const letterDz = d3.create("svg:g")
        .attr("class", "letter-dz")

    appendLine(letterDz, x, y, x, y-size)
    appendCurve(letterDz,
        {x: x, y: y-size},
        {x: x, y: y},
        {x: x+size, y: y-size},
        {x: x+size, y: y}
    )

    appendLine(letterDz, x+size*0.9, y, x+size*1.4, y)
    appendLine(letterDz, x+size*0.9, y-size/2, x+size*1.4, y-size/2)
    appendLine(letterDz, x+size*0.9, y, x+size*1.4, y-size/2)

    return letterDz
}

function dzs(x, y, size) {

    const letterDzs = d3.create("svg:g")
        .attr("class", "letter-dzs")

    appendLine(letterDzs, x, y, x, y-size)
    appendCurve(letterDzs,
        {x: x, y: y-size},
        {x: x, y: y},
        {x: x+size, y: y-size},
        {x: x+size, y: y}
    )

    appendLine(letterDzs, x+size*0.9, y, x+size*1.4, y)
    appendLine(letterDzs, x+size*0.9, y-size/2, x+size*1.4, y-size/2)
    appendLine(letterDzs, x+size*0.9, y, x+size*1.4, y-size/2)

    const r = elbaszo(size / 7);
    const cx = elbaszo(x + size * 1.7);
    const topY = elbaszo(y - size / 2 + size/10);   // top
    const botY = elbaszo(y - size / 6 + size/10);   // bottom

    letterDzs.append("path")
        .attr("d", `M ${cx + r * Math.SQRT1_2} ${topY - r * Math.SQRT1_2}
                    A ${r} ${r} 0 1 0 ${cx} ${topY + r}
                    A ${r} ${r} 0 1 1 ${cx - r} ${botY}`)
        .attr("fill", "none")
        .attr("stroke", "black")
        .attr("stroke-width", 1)
        .attr("stroke-linecap", "round");

    return letterDzs
}

function e(x, y, size) {

    const width = size
    const height = size

    const letterE = d3.create("svg:g")
        .attr("class", "letter-e")

    appendLine(letterE, x, y, x+width/1.25, y)
    appendLine(letterE, x, y-height/2, x+width/1.5, y-height/2)
    appendLine(letterE, x, y-height, x+width/1.25, y-height)

}

    appendLine(letterG, x+width/2, y-height/2, x+width, y-height/2)

function j(x, y, size) {

    appendLine(letterJ, rightX, y-size*0.8, rightX, y)

    appendCurve(letterJ,

function k(x, y, size) {

    appendLine(letterK, x, y-size*0.4, x+unit*kXv*4, y-(size))
    return letterK

}

function s(x, y, size) {

    const letterS = d3.create("svg:g")
        .attr("class", "letter-s")

    const r = elbaszo(size / 4);
    const cx = elbaszo(x+size*0.25);
    const topY = elbaszo(y - size + size*0.25);   // top 
    const botY = elbaszo(y - size*0.5 + size*0.25);   // bottom

    letterS.append("path")
        .attr("d", `M ${cx + r * elbaszo(Math.SQRT1_2)} ${topY - r * elbaszo(Math.SQRT1_2)}
                    A ${r} ${r} 0 1 0 ${cx} ${topY + r}
                    A ${r} ${r} 0 1 1 ${cx - r} ${botY}`)

        .attr("stroke-width", 1)
        .attr("stroke-linecap", "round");
        
    return letterS

}

function sz(x, y, size) {

    return letterUu
}

function u1u1(x, y, size) {
    const letterU1 = d3.create("svg:g")
        .attr("class", "letter-u1u1")
        
    appendLine(letterU1, x, y-size*0.25, x, y-size*0.9)
    appendLine(letterU1, x+size*0.5, y-size*0.25, x+size*0.5, y-size*0.9)
        
    appendArc(letterU1, x+size*0.25, y-size*0.25, size/2+1, Math.PI*0.5, Math.PI*1.5)

    appendLine(letterU1, x+size*0.25, y-size-size*0.1, x+size*0.15, y-size*0.9)
    appendLine(letterU1, x+size*0.35, y-size-size*0.1, x+size*0.25, y-size*0.9)

    return letterU1
}

    return letterZ
}

function zs(x, y, size) {
    const letterZs = d3.create("svg:g")
        .attr("class", "letter-zs")
        
    appendLine(letterZs, x, y-size, x+size*0.8, y-size)
    appendLine(letterZs, x+size*0.8, y-size, x, y)
    appendLine(letterZs, x, y, x+size*0.8, y)
        
    const r = size / 6;
    const cx = x + size;
    const topY = y - size / 2;   // top
    const botY = y - size / 6;   // bottom

    letterZs.append("path")
        .attr("d", `M ${cx + r * Math.SQRT1_2} ${topY - r * Math.SQRT1_2}
                    A ${r} ${r} 0 1 0 ${cx} ${topY + r}
                    A ${r} ${r} 0 1 1 ${cx - r} ${botY}`)
        .attr("fill", "none")
        .attr("stroke", "black")
        .attr("stroke-width", 1)
        .attr("stroke-linecap", "round");

    return letterZs
}

function writeRow(row, letterSize, space, rowY) {
    let newLetterX = 10;
    let rowLetter;
    let rowLetterElem;
    let rowLetterFunc;
    for (let i=0; i<=row.length-1; i++) {
         
        rowLetter = row[i]
        if (rowLetter == ' ') {
            newLetterX += space*3
        } else {
            rowLetterFunc = abc[rowLetter]

            rowLetterElem = rowLetterFunc(newLetterX, rowY, letterSize)
            let rowLetterX = getRightX(rowLetterElem)
            svg.append(() => rowLetterElem.node())
            newLetterX = rowLetterX + space    
        }
        
    }
}

    const rowTexts = poem.toLowerCase().split('\n')
