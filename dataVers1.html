<!DOCTYPE html>
<head></head>
<style>
text {
	font-family: 'Times New Roman', 'Times', serif;
	font-size: 20px;
	font-weight: bold;
	fill: black;
}
</style>
<body>
<div id="container"></div>
</body>
<script type="module">

import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";



let data = [];
for (let i = 0; i<200; i++) {
  data.push({name: i, value: Math.random()*1000})
}

console.log(data)

const width = 1500;
const height = 1600;
const padding = 20;
const endCount = 18;

// Create the SVG container.
const svg = d3.select("#container")
  .append("svg")
  .attr("width", width)
  .attr("height", height);

svg.selectAll("rect")
  .data(data)
  .join("rect")
  // .attr("x", (d, i) => 10 * (barWidth + padding))
  .attr("class", "smallrect")
  .attr("x", (d, i) => i)
  .attr("y", d => d.value)
  .attr("width", d => d.value)
  .attr("height", d => d.value)
  .attr("stroke", "black")
  .attr("opacity", 0.4)
  .attr("fill", "none");

let selection = d3.selectAll(".smallrect")
for (let i = 0; i<endCount; i++) {

  selection = selection.transition()
    .duration(240)
    .attr("x", 10)

  selection = selection
  .transition()
    .duration(400)
    .attr("x", (d, i) => i*Math.random())
    .attr("y", d => d.value)
    .attr("height", Math.random()*100)
    .attr("width", Math.random() * 100)
  
  
}

await new Promise(r => setTimeout(r, 640*endCount));  
const poem = `
hello, köszi.
Remélem tetszett.
Ide jön majd a vers.
`
svg.append("text").text(poem).attr("x", 200).attr("y", 500)






</script>
